<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Strategy Goo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  :root{
    --bg:#171b13;
    --panel:#20261b;
    --panel-border:#3a4330;
    --ink:#e9e4d4;
    --ink-dim:#a8a692;
    --gold:#c9a227;
    --player:#49b8ac;
    --player-dim:#2c5852;
    --enemy:#d1594a;
    --enemy-dim:#5a2e28;
    --mountain:#7a6f5c;
    --lake:#2c6079;
    --ground:#2b3122;
    --fog:#0d0f09;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:radial-gradient(ellipse at top, #232a1c 0%, var(--bg) 60%);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:24px 16px 60px;
  }
  h1,h2,h3{font-family:'Cinzel',serif; margin:0; letter-spacing:0.02em;}
  .wrap{max-width:1020px; margin:0 auto;}
  header.top{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px; flex-wrap:wrap; gap:8px;}
  header.top h1{font-size:1.6rem; color:var(--gold);}
  .subtitle{color:var(--ink-dim); font-size:0.85rem; margin-bottom:20px;}
  .scoreboard{display:flex; gap:14px; align-items:center; font-size:0.85rem; color:var(--ink-dim);}
  .pip-row{display:flex; gap:4px;}
  .pip{width:11px; height:11px; border-radius:50%; border:1px solid var(--panel-border); background:transparent;}
  .pip.filled-player{background:var(--player); border-color:var(--player);}
  .pip.filled-bot{background:var(--enemy); border-color:var(--enemy);}
  .panel{
    background:linear-gradient(180deg, #232a1c 0%, var(--panel) 100%);
    border:1px solid var(--panel-border);
    border-radius:3px;
    padding:22px 24px;
    margin-bottom:16px;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
  }
  .panel h2{font-size:1.15rem; color:var(--gold); margin-bottom:12px;}
  .panel h3{font-size:0.9rem; color:var(--ink); margin-bottom:8px;}
  button{
    font-family:'Inter',sans-serif;
    background:linear-gradient(180deg, #3a7d74, var(--player-dim));
    color:var(--ink);
    border:1px solid var(--player);
    border-radius:3px;
    padding:9px 16px;
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
    transition:filter 0.12s ease, transform 0.08s ease;
  }
  button:hover:not(:disabled){filter:brightness(1.25); transform:translateY(-1px);}
  button:active:not(:disabled){transform:translateY(0);}
  button:disabled{opacity:0.35; cursor:not-allowed;}
  button.ghost{background:transparent; border-color:var(--panel-border); color:var(--ink-dim);}
  button.danger{background:linear-gradient(180deg,#a8493c,var(--enemy-dim)); border-color:var(--enemy);}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .between{justify-content:space-between;}
  .diff-tag{
    border:1px solid var(--gold); color:var(--gold); border-radius:3px;
    padding:2px 10px; font-size:0.72rem; font-weight:700; letter-spacing:0.03em;
    text-transform:uppercase;
  }
  .diff-tag:empty{display:none;}

  .card-grid{display:flex; gap:14px; flex-wrap:wrap;}
  .map-choices{display:flex; gap:14px; flex-wrap:wrap;}
  .map-card, .diff-card{
    border:1px solid var(--panel-border);
    border-radius:3px;
    padding:16px 18px;
    background:#1a1f15;
    font-size:0.8rem;
    color:var(--ink-dim);
    min-width:170px;
    display:flex; flex-direction:column; gap:9px;
    transition:border-color 0.15s ease, transform 0.12s ease, box-shadow 0.15s ease;
  }
  .map-card:hover, .diff-card:hover{
    border-color:var(--gold);
    transform:translateY(-2px);
    box-shadow:0 6px 18px rgba(0,0,0,0.3);
  }
  .map-card b, .diff-card b{color:var(--gold); display:block; font-family:'Cinzel',serif; font-size:1.05rem;}
  .map-card svg{align-self:center; background:var(--bg); border-radius:2px;}
  .diff-card{min-width:190px;}
  .diff-card .diff-head{display:flex; align-items:center; justify-content:space-between;}
  .diff-card .diff-budget{font-size:0.75rem; color:var(--gold); font-weight:700;}
  .diff-pips{display:flex; gap:3px;}
  .diff-pip{width:8px; height:8px; border-radius:50%; background:var(--panel-border);}
  .diff-pip.on{background:var(--gold);}
  .diff-card.easy{border-left:3px solid #7bbf6a;}
  .diff-card.medium{border-left:3px solid #c9a227;}
  .diff-card.hard{border-left:3px solid #d1794a;}
  .diff-card.impossible{border-left:3px solid #d1594a;}

  .shop-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:10px; margin-bottom:14px;}
  .shop-item{border:1px solid var(--panel-border); background:#1a1f15; border-radius:3px; padding:10px 12px; transition:border-color 0.15s ease;}
  .shop-item:hover{border-color:var(--panel-border);}
  .shop-item .title{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;}
  .shop-item .title b{font-size:0.92rem;}
  .shop-item .cost{color:var(--gold); font-weight:700; font-size:0.8rem;}
  .shop-item .stats{color:var(--ink-dim); font-size:0.72rem; line-height:1.5; margin-bottom:8px;}
  .qty-row{display:flex; align-items:center; gap:8px;}
  .qty-row button{padding:2px 10px; font-size:1rem; line-height:1;}
  .qty-count{min-width:18px; text-align:center; font-weight:700;}
  .budget-line{font-size:0.9rem; margin:10px 0; color:var(--ink);}
  .budget-line b{color:var(--gold);}

  .board-wrap{display:flex; gap:18px; flex-wrap:wrap; align-items:flex-start;}
  #boardHolder{background:#0c0e08; border:2px solid var(--panel-border); border-radius:3px; padding:10px;}
  #boardHolder svg{display:block; cursor:crosshair;}

  .side{flex:1; min-width:230px; display:flex; flex-direction:column; gap:12px;}
  .info-box{border:1px solid var(--panel-border); border-radius:3px; padding:12px 14px; background:#1a1f15; font-size:0.85rem;}
  .info-box .name{font-family:'Cinzel',serif; color:var(--gold); font-size:1rem; margin-bottom:4px;}
  .info-box .line{color:var(--ink-dim); font-size:0.78rem; line-height:1.6;}
  .turn-banner{font-size:0.95rem; padding:8px 12px; border-radius:3px; text-align:center; font-weight:600;}
  .turn-banner.player{background:var(--player-dim); border:1px solid var(--player);}
  .turn-banner.bot{background:var(--enemy-dim); border:1px solid var(--enemy);}
  .log{
    border:1px solid var(--panel-border); border-radius:3px; padding:10px 12px;
    background:#141810; font-size:0.76rem; color:var(--ink-dim);
    max-height:220px; overflow-y:auto; display:flex; flex-direction:column-reverse;
  }
  .log div{padding:2px 0; border-bottom:1px solid rgba(255,255,255,0.04);}
  .placement-queue{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0;}
  .queue-chip{border:1px solid var(--gold); color:var(--gold); border-radius:2px; padding:3px 8px; font-size:0.75rem; font-weight:600;}
  .queue-chip.done{opacity:0.3; text-decoration:line-through;}
  .center-msg{text-align:center; padding:30px 10px;}
  .center-msg h2{font-size:1.4rem; margin-bottom:10px;}
  .center-msg p{color:var(--ink-dim); margin-bottom:18px;}
  .hint{font-size:0.75rem; color:var(--ink-dim); margin-top:4px;}
  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:0.72rem; color:var(--ink-dim); margin-top:10px;}
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .swatch{width:11px; height:11px; border-radius:50%; display:inline-block;}
  .room-code{font-family:'Cinzel',serif; font-size:2.2rem; letter-spacing:0.15em; color:var(--gold); margin:10px 0;}
  .code-input{
    font-family:'Cinzel',serif; font-size:1.4rem; letter-spacing:0.2em; text-align:center; text-transform:uppercase;
    padding:8px; width:150px; background:#1a1f15; border:1px solid var(--panel-border); color:var(--ink); border-radius:3px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>⚔ Strategy Goo</h1>
    <div class="scoreboard">
      <span id="difficultyTag" class="diff-tag"></span>
      <span>Round <span id="roundNum">1</span> of 3</span>
      <div class="row" style="gap:6px;">
        <span id="playerLabel" style="color:var(--player)">You</span>
        <div class="pip-row" id="playerPips"></div>
        <span style="margin:0 4px;">–</span>
        <div class="pip-row" id="botPips"></div>
        <span id="botLabel" style="color:var(--enemy)">Bot</span>
      </div>
    </div>
  </header>
  <div class="subtitle">Freeform battlefield — a 7×7 zone on each side, no tiles. Fog of war, preset terrain, best of 3.</div>
  <div id="app"></div>
</div>

<script>
/* ============================= DATA ============================= */

const UNIT_TYPES = {
  footman:  { key:'footman',  name:'Footman',         icon:'⚔', cost:1, speed:2, range:1, dmg:1, hp:2, vision:2, desc:'Speed 2 · Range 1 · Dmg 1 · HP 2. Cheap versatile pressure.' },
  armored:  { key:'armored',  name:'Armored Footman',  icon:'🛡', cost:2, speed:1, range:1, dmg:2, hp:3, vision:2, desc:'Speed 1 · Range 1 · Dmg 2 · HP 3. A wall built to tank.' },
  horseman: { key:'horseman', name:'Horseman',        icon:'♞', cost:3, speed:3, range:1, dmg:2, hp:2, vision:3, desc:'Speed 3 · Range 1 · Dmg 2 · HP 2. Runs down footmen.' },
  gunman:   { key:'gunman',   name:'Gunman',          icon:'✛', cost:4, speed:1, range:4, dmg:3, hp:1, vision:4, desc:'Speed 1 · Range 4 · Dmg 3 · HP 1. Long-range sniper, fragile.' },
  mountainman: { key:'mountainman', name:'Mountainman', icon:'⛰', cost:8, speed:1, range:2, dmg:2, hp:3, vision:3,
    boosted:{speed:2, range:4, dmg:5},
    desc:'Speed 1→2, Range 2→4, Dmg 2→5 while standing on a mountain · HP 3 · Cost 8. Moves through mountains at normal cost — no one else can.' },
  cannonship: { key:'cannonship', name:'Cannonship', icon:'🚢', cost:14, speed:1, range:5, dmg:2, hp:6, vision:4,
    desc:'Speed 1 · Range 5 · Dmg 2 · HP 6 · Cost 14. Must be placed on water — the only unit that can cross lakes. Can come ashore once; after that it can never move again.' },
};
const BASE_STATS = { name:'Base', icon:'⌂', speed:0, range:2, dmg:1, hp:20, vision:3 };

// Board: two 7x7 zones stacked — bot's half is y in [0,7], player's half is y in [7,14].
const BOARD = { w:7, h:14 }; // mutated per-round for the randomized battlefield; presets always reset it to 7x14
function totalBudgetBase(){ return BOARD.w * 4; }

// Preset maps: terrain is circular zones in continuous board-unit coordinates,
// mirrored around the board's center (3.5, 7) so both sides play fair.
const MAPS = [
  {
    key:'border', name:'Border Skirmish',
    blurb:'A single mountain knot commands the center.',
    mountains:[{x:3.5,y:7,r:1.2}],
    lakes:[],
  },
  {
    key:'lakes', name:'Twin Lakes',
    blurb:'Mirrored lakes pinch the approach on both flanks.',
    mountains:[{x:3.5,y:7,r:0.6}],
    lakes:[{x:1.7,y:7,r:1.0},{x:5.3,y:7,r:1.0}],
  },
  {
    key:'pass', name:'Mountain Pass',
    blurb:'Twin ranges wall off the field but for one narrow pass.',
    mountains:[{x:1.5,y:7,r:1.6},{x:5.5,y:7,r:1.6}],
    lakes:[],
  },
];

const DIFFICULTIES = {
  easy:       { key:'easy', label:'Easy', tier:0, budgetMult:0.8, blurb:'Bot buys fewer points and often makes poor tactical calls.' },
  medium:     { key:'medium', label:'Medium', tier:1, budgetMult:1.0, blurb:'Normal points, sensible target priority, straightforward advances.' },
  hard:       { key:'hard', label:'Hard', tier:2, budgetMult:1.25, blurb:'+25% points. Avoids bad trades and reckless advances into danger.' },
  impossible: { key:'impossible', label:'Impossible', tier:3, budgetMult:1.6, blurb:'+60% points. Plays optimally and always knows where your units are.' },
};
function botBudget(){ return Math.round(totalBudgetBase() * DIFFICULTIES[G.difficulty].budgetMult); }

/* ============================= ROLE / MODE HELPERS ============================= */

// "player" = bottom/teal side, "bot" = top/red side. Who actually CONTROLS each side
// depends on G.mode: vsBot -> AI controls bot; passPlay -> a human controls bot on
// the same device, turn by turn; online -> a human controls bot on a different device.
function otherRole(r){ return r==='player' ? 'bot' : 'player'; }
function colorFor(role){ return role==='player' ? 'var(--player)' : 'var(--enemy)'; }
function teamName(role){ return role==='player' ? 'Teal' : 'Red'; } // used in the shared/synced log — must read the same on both screens
function sideLabel(role){ // used in on-screen chrome only — safe to be viewer-relative
  if(!G.mode) return role==='player' ? 'Player 1' : 'Player 2';
  if(G.mode==='vsBot') return role==='player' ? 'You' : 'Bot';
  if(G.mode==='passPlay') return role==='player' ? 'Player 1 (Teal)' : 'Player 2 (Red)';
  return role===G.myRole ? 'You' : 'Opponent';
}
// Whose perspective the board/fog/turn-permissions should currently reflect.
function viewerRole(){
  if(G.phase==='setup' || G.phase==='placing') return G.activeSetupRole;
  if(G.mode==='passPlay') return G.turn;
  return G.myRole;
}

/* ============================= STATE ============================= */

let G = null;

function newMatch(){
  G = {
    round: 1,
    wins: { player:0, bot:0 },
    leftover: 0,
    phase: 'mainmenu',
    mode: null,        // 'vsBot' | 'passPlay' | 'online'
    myRole: null,      // fixed per-device role for online; 'player' for vsBot
    activeSetupRole: null, // whose shop/placement is currently active (matters for passPlay)
    difficulty: 'medium',
    map: null,
    units: [],
    nextId: 1,
    shopCounts: {},
    placementQueue: [],
    placeCursor: 0,
    turn: 'player',
    actionsLeft: 3,
    selected: null,
    uiMode: 'idle',
    log: [],
    mapMode: null,
    localReady: false,
    oppReady: false,
    oppUnits: null,
    roomCode: null,
    netStatus: '',
    interstitialMessage: '',
    interstitialContinue: null,
  };
  BOARD.w = 7; BOARD.h = 14;
  render();
}

function chooseMode(mode){
  G.mode = mode;
  if(mode === 'vsBot'){
    G.myRole = 'player';
    G.phase = 'difficulty';
  } else if(mode === 'passPlay'){
    G.myRole = null;
    G.activeSetupRole = null;
    BOARD.w = 7; BOARD.h = 14;
    G.phase = 'mapselect';
    G.mapMode = null;
  } else if(mode === 'online'){
    G.phase = 'onlineMenu';
  }
  render();
}

function backToMainMenu(){
  if(netConn){ try{ netConn.close(); }catch(e){} netConn=null; }
  if(netPeer){ try{ netPeer.destroy(); }catch(e){} netPeer=null; }
  newMatch();
}

function setDifficulty(key){
  G.difficulty = key;
  G.phase = 'mapselect';
  G.mapMode = null;
  BOARD.w = 7; BOARD.h = 14; // presets always preview/play at 7x7 per side
  render();
}

function currentMap(){ return G.map; }

function setMap(mapKey){
  BOARD.w = 7; BOARD.h = 14;
  G.map = MAPS.find(m=>m.key===mapKey);
  startSetup();
  if(G.mode==='online' && G.myRole==='player') netSend({type:'state', state:serializeState()});
}

function setCustomMap(mapObj){
  if(mapObj.boardW){ BOARD.w = mapObj.boardW; BOARD.h = mapObj.boardH; }
  G.map = mapObj;
  startSetup();
  if(G.mode==='online' && G.myRole==='player') netSend({type:'state', state:serializeState()});
}

// Fully random, independent (non-mirrored) terrain, on a random side length (5-15
// per side) — no fairness guarantee, on purpose. Never previewed before picking;
// you find out what you got (map AND size) once the battle starts.
function generateRandomMap(){
  const size = 5 + Math.floor(Math.random()*11); // 5..15
  const w = size, h = size*2;
  const margin = 0.8;
  const bases = [{x:w/2,y:h-margin}, {x:w/2,y:margin}];
  const mountains = [];
  const lakes = [];
  const count = 3 + Math.floor(Math.random()*4); // 3-6 independent features
  for(let i=0;i<count;i++){
    let x,y,r, ok=false, tries=0;
    while(!ok && tries<25){
      r = 0.4 + Math.random()*0.9;
      x = r + Math.random()*(w - 2*r);
      y = 1.0 + Math.random()*(h - 2.0);
      ok = bases.every(b => Math.hypot(x-b.x,y-b.y) > r + 1.1); // don't bury a base entirely
      tries++;
    }
    if(!ok) continue;
    const isLake = Math.random() < 0.35;
    (isLake ? lakes : mountains).push({x,y,r});
  }
  return {
    key:'random_'+Date.now()+'_'+Math.floor(Math.random()*10000),
    name:'Randomized Battlefield',
    blurb:'Fully random, asymmetric terrain.',
    boardW: w, boardH: h,
    mountains, lakes,
  };
}

function logMsg(text){
  G.log.push(text);
  if(G.log.length > 60) G.log.shift();
}

/* ============================= GEOMETRY HELPERS ============================= */

function dist(x1,y1,x2,y2){ return Math.hypot(x1-x2, y1-y2); }
function inBoundsXY(x,y){ return x>=0 && x<=BOARD.w && y>=0 && y<=BOARD.h; }
function pointInAnyMountain(x,y){ return currentMap().mountains.some(m => dist(x,y,m.x,m.y) <= m.r); }
function pointInAnyLake(x,y){ return currentMap().lakes.some(l => dist(x,y,l.x,l.y) <= l.r); }
function mapHasLakeForOwner(ownerKey){
  return currentMap().lakes.some(l => ownerKey==='player' ? (l.y + l.r >= BOARD.h/2) : (l.y - l.r <= BOARD.h/2));
}
function unitAtPoint(x,y, radius){
  radius = radius || 0.45;
  let best=null, bestD=Infinity;
  G.units.forEach(u=>{
    if(u.hp<=0) return;
    const d = dist(u.x,u.y,x,y);
    if(d<=radius && d<bestD){ bestD=d; best=u; }
  });
  return best;
}
function livingUnits(owner){ return G.units.filter(u=>u.owner===owner && u.hp>0); }
function statsOf(u){
  if(u.isBase) return BASE_STATS;
  const def = UNIT_TYPES[u.key];
  if(def.boosted && pointInAnyMountain(u.x,u.y)) return Object.assign({}, def, def.boosted);
  if(u.key==='cannonship' && u.hasLanded) return Object.assign({}, def, {speed:0});
  return def;
}
function owner(u){ return u.owner; }
function labelFor(u){ return u.isBase ? 'Base' : UNIT_TYPES[u.key].name; }

const MIN_GAP = 0.55;
function tooCloseToAnyUnit(x,y,excludeId){
  return G.units.some(u=>u.hp>0 && u.id!==excludeId && dist(u.x,u.y,x,y) < MIN_GAP);
}

function ownHalf(ownerKey, y){ return ownerKey==='player' ? y>=BOARD.h/2 : y<=BOARD.h/2; }
function baseSpawn(ownerKey){ const margin=0.8; return ownerKey==='player' ? {x:BOARD.w/2,y:BOARD.h-margin} : {x:BOARD.w/2,y:margin}; }

// Walk from a unit toward (tx,ty), accumulating movement cost (mountains cost 2x per
// unit length, lakes are impassable to everyone except the Cannonship, which instead
// can only cross mountains never). Returns whether the destination is reachable
// within the unit's speed budget this turn.
function evaluatePath(unit, tx, ty){
  const totalDist = dist(unit.x,unit.y,tx,ty);
  if(totalDist < 1e-6) return {reachable:false};
  const ux = (tx-unit.x)/totalDist, uy = (ty-unit.y)/totalDist;
  const step = 0.04;
  const isShip = unit.key === 'cannonship';
  let traveled = 0, cost = 0, x = unit.x, y = unit.y;
  while(traveled < totalDist - 1e-6){
    const s = Math.min(step, totalDist-traveled);
    const nx = x+ux*s, ny = y+uy*s;
    if(!inBoundsXY(nx,ny)) return {reachable:false};
    let stepCost = s;
    if(isShip){
      if(pointInAnyMountain(nx,ny)) return {reachable:false};
    } else {
      if(pointInAnyLake(nx,ny)) return {reachable:false};
      if(pointInAnyMountain(nx,ny) && unit.key!=='mountainman') stepCost = s*2;
    }
    cost += stepCost;
    traveled += s; x = nx; y = ny;
  }
  if(tooCloseToAnyUnit(tx,ty,unit.id)) return {reachable:false};
  if(cost > statsOf(unit).speed + 1e-6) return {reachable:false, cost};
  return {reachable:true, cost};
}

// Furthest point reachable heading in a given direction, for drawing the movement blob.
function marchMax(unit, angle, budget){
  const ux = Math.cos(angle), uy = Math.sin(angle);
  const step = 0.06;
  const isShip = unit.key === 'cannonship';
  let cost = 0, x = unit.x, y = unit.y, last = {x,y};
  while(true){
    const nx = x+ux*step, ny = y+uy*step;
    if(!inBoundsXY(nx,ny)) break;
    let stepCost = step;
    if(isShip){
      if(pointInAnyMountain(nx,ny)) break;
    } else {
      if(pointInAnyLake(nx,ny)) break;
      if(pointInAnyMountain(nx,ny) && unit.key!=='mountainman') stepCost = step*2;
    }
    if(cost+stepCost > budget+1e-9) break;
    cost += stepCost; x = nx; y = ny; last = {x,y};
  }
  return last;
}
function reachablePolygon(unit){
  const budget = statsOf(unit).speed;
  const pts = [];
  const N = 48;
  for(let i=0;i<N;i++) pts.push(marchMax(unit, (i/N)*2*Math.PI, budget));
  return pts;
}

function visibleTilePoint(ownerKey, x, y){
  return livingUnits(ownerKey).some(u => dist(u.x,u.y,x,y) <= statsOf(u).vision + 1e-9);
}
function isUnitVisibleTo(ownerKey, target){
  return visibleTilePoint(ownerKey, target.x, target.y);
}

/* ============================= NETWORKING (online mode, PeerJS) ============================= */

let netPeer = null;
let netConn = null;
const ROOM_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function randomRoomCode(){
  let s = '';
  for(let i=0;i<4;i++) s += ROOM_ALPHABET[Math.floor(Math.random()*ROOM_ALPHABET.length)];
  return s;
}

function netSend(msg){
  if(netConn && netConn.open) netConn.send(msg);
}

function hostGame(attempt){
  attempt = attempt || 0;
  const code = randomRoomCode();
  G.phase = 'onlineHostWait';
  G.roomCode = code;
  G.netStatus = 'Connecting to relay…';
  render();
  const peer = new Peer('sg-'+code);
  netPeer = peer;
  peer.on('open', ()=>{
    G.netStatus = "Room ready — waiting for your friend to join…";
    render();
  });
  peer.on('connection', (conn)=>{
    netConn = conn;
    conn.on('open', ()=>{
      G.myRole = 'player';
      G.mode = 'online';
      G.phase = 'mapselect';
      G.mapMode = null;
      BOARD.w=7; BOARD.h=14;
      render();
    });
    conn.on('data', handleNetMessage);
    conn.on('close', onPeerDisconnected);
  });
  peer.on('error', (err)=>{
    if(err.type === 'unavailable-id' && attempt < 5){
      peer.destroy();
      hostGame(attempt+1);
    } else {
      G.netStatus = 'Connection error (' + err.type + '). Try again.';
      render();
    }
  });
}

function joinGame(rawCode){
  const code = (rawCode||'').trim().toUpperCase();
  if(!code) return;
  G.netStatus = 'Connecting…';
  render();
  const peer = new Peer();
  netPeer = peer;
  peer.on('open', ()=>{
    const conn = peer.connect('sg-'+code, {reliable:true});
    netConn = conn;
    conn.on('open', ()=>{
      G.myRole = 'bot';
      G.mode = 'online';
      G.phase = 'mapselect';
      render();
    });
    conn.on('data', handleNetMessage);
    conn.on('close', onPeerDisconnected);
    conn.on('error', ()=>{
      G.netStatus = "Couldn't connect — check the code and try again.";
      render();
    });
  });
  peer.on('error', (err)=>{
    G.netStatus = 'Connection error (' + err.type + '). Try again.';
    render();
  });
}

function onPeerDisconnected(){
  logMsg('Connection to your opponent was lost.');
  render();
}

function serializeState(){
  return {
    round: G.round, wins: {player:G.wins.player, bot:G.wins.bot}, leftover: G.leftover,
    phase: G.phase, map: G.map, units: JSON.parse(JSON.stringify(G.units)), nextId: G.nextId,
    turn: G.turn, actionsLeft: G.actionsLeft, log: G.log.slice(-30), roundWinner: G.roundWinner,
    boardW: BOARD.w, boardH: BOARD.h,
  };
}
function applyState(s){
  G.round=s.round; G.wins=s.wins; G.leftover=s.leftover; G.phase=s.phase;
  G.map=s.map; G.units=s.units; G.nextId=s.nextId; G.turn=s.turn;
  G.actionsLeft=s.actionsLeft; G.log=s.log; G.roundWinner=s.roundWinner;
  BOARD.w=s.boardW; BOARD.h=s.boardH;
  G.selected=null; G.uiMode='idle';
  if(s.phase === 'setup'){
    // the guest never calls startSetup() locally (it only ever adopts the host's
    // broadcast phase), so its shop counts and active role need init here instead —
    // this only ever fires once per round, right when the host's map choice arrives.
    Object.keys(UNIT_TYPES).forEach(k => G.shopCounts[k] = 0);
    G.activeSetupRole = G.myRole;
  }
  render();
}
function handleNetMessage(msg){
  if(!msg) return;
  if(msg.type === 'ready'){
    G.oppReady = true;
    G.oppUnits = msg.units;
    maybeHostMerge();
  } else if(msg.type === 'state'){
    applyState(msg.state);
  }
}
// Host is authoritative for combining both sides' independently-placed rosters into
// one shared battle state, avoiding any merge race between the two peers.
function maybeHostMerge(){
  if(G.myRole !== 'player') return;
  if(!G.localReady || !G.oppReady) return;
  const mine = G.units.filter(u=>u.owner==='player');
  G.units = mine.concat(G.oppUnits);
  G.phase = 'battle';
  G.turn = 'player';
  G.actionsLeft = 3;
  G.units.forEach(u=>u.acted=false);
  logMsg(`Round ${G.round} begins on "${G.map.name}".`);
  netSend({type:'state', state:serializeState()});
  render();
}
function onlineRematch(){
  G.round=1; G.wins={player:0,bot:0}; G.leftover=0; G.units=[]; G.nextId=1;
  G.selected=null; G.uiMode='idle'; G.phase='mapselect'; G.mapMode=null;
  G.localReady=false; G.oppReady=false; G.oppUnits=null;
  BOARD.w=7; BOARD.h=14;
  render();
  netSend({type:'state', state:serializeState()});
}

/* ============================= SETUP PHASE ============================= */

function startSetup(){
  G.phase = 'setup';
  if(G.mode !== 'passPlay'){
    G.activeSetupRole = G.myRole; // vsBot & online: always "my" role
  } else if(!G.activeSetupRole){
    G.activeSetupRole = 'player'; // first setup of the round in pass & play
  }
  Object.keys(UNIT_TYPES).forEach(k => G.shopCounts[k] = 0);
  render();
}
function spentPoints(){ return Object.entries(G.shopCounts).reduce((s,[k,n])=>s+UNIT_TYPES[k].cost*n,0); }
function totalBudget(){ return totalBudgetBase() + G.leftover; }
function remainingPoints(){ return totalBudget() - spentPoints(); }

function changeQty(key, delta){
  const next = G.shopCounts[key] + delta;
  if(next < 0) return;
  const cost = UNIT_TYPES[key].cost;
  if(delta > 0 && spentPoints() + cost > totalBudget()) return;
  G.shopCounts[key] = next;
  render();
}

function confirmShop(){
  const q = [];
  Object.entries(G.shopCounts).forEach(([k,n])=>{ for(let i=0;i<n;i++) q.push(k); });
  if(q.length === 0){ alert('Buy at least one unit before heading into battle.'); return; }
  G.pendingLeftover = remainingPoints();
  G.placementQueue = q;
  G.placeCursor = 0;
  G.phase = 'placing';
  const role = G.activeSetupRole;
  const bs = baseSpawn(role);
  G.units.push({id:G.nextId++, owner:role, key:'base', isBase:true, x:bs.x, y:bs.y, hp:BASE_STATS.hp, maxHp:BASE_STATS.hp, acted:false});
  render();
}

function placeAt(x,y){
  if(G.phase !== 'placing') return;
  if(G.placeCursor >= G.placementQueue.length) return;
  const role = G.activeSetupRole;
  if(!ownHalf(role, y)) return;
  if(!inBoundsXY(x,y)) return;
  const key = G.placementQueue[G.placeCursor];
  const inMountain = pointInAnyMountain(x,y);
  const inLake = pointInAnyLake(x,y);
  if(key === 'cannonship'){
    if(!inLake) return; // ships must be launched on water
  } else {
    if(inLake) return; // land units can't start in water
    if(inMountain && key !== 'mountainman') return; // only the Mountainman starts on a mountain
  }
  if(tooCloseToAnyUnit(x,y,null)) return;
  const def = UNIT_TYPES[key];
  G.units.push({id:G.nextId++, owner:role, key, isBase:false, x, y, hp:def.hp, maxHp:def.hp, acted:false, hasLanded:false});
  G.placeCursor++;
  if(G.placeCursor >= G.placementQueue.length) finalizeSetupAndStartBattle();
  else render();
}

function botSetup(){
  const budget = botBudget();
  let remaining = budget;
  const keys = Object.keys(UNIT_TYPES).filter(k => k!=='cannonship' || mapHasLakeForOwner('bot'));
  const counts = {footman:0, armored:0, horseman:0, gunman:0, mountainman:0, cannonship:0};
  while(remaining > 0){
    const affordable = keys.filter(k => UNIT_TYPES[k].cost <= remaining);
    if(affordable.length === 0) break;
    const pick = affordable[Math.floor(Math.random()*affordable.length)];
    counts[pick]++;
    remaining -= UNIT_TYPES[pick].cost;
  }
  const bs = baseSpawn('bot');
  G.units.push({id:G.nextId++, owner:'bot', key:'base', isBase:true, x:bs.x, y:bs.y, hp:BASE_STATS.hp, maxHp:BASE_STATS.hp, acted:false});
  Object.entries(counts).forEach(([k,n])=>{
    for(let i=0;i<n;i++){
      let placed=false;
      for(let attempt=0; attempt<120 && !placed; attempt++){
        const x = Math.random()*BOARD.w;
        const y = k==='cannonship' ? Math.random()*(BOARD.h/2) : Math.random()*(BOARD.h/4);
        const inMountain = pointInAnyMountain(x,y);
        const inLake = pointInAnyLake(x,y);
        const valid = k==='cannonship' ? inLake : (!inLake && (!inMountain || k==='mountainman'));
        if(valid && !tooCloseToAnyUnit(x,y,null)){
          const def = UNIT_TYPES[k];
          G.units.push({id:G.nextId++, owner:'bot', key:k, isBase:false, x, y, hp:def.hp, maxHp:def.hp, acted:false, hasLanded:false});
          placed = true;
        }
      }
    }
  });
}

function finalizeSetupAndStartBattle(){
  if(G.mode === 'vsBot'){
    botSetup();
    startBattlePhase();
  } else if(G.mode === 'passPlay'){
    if(G.activeSetupRole === 'player'){
      G.activeSetupRole = 'bot';
      showInterstitial(`Pass the device to ${sideLabel('bot')}. Tap Continue when you're ready to set up.`, ()=>{ startSetup(); });
    } else {
      startBattlePhase();
    }
  } else if(G.mode === 'online'){
    G.localReady = true;
    netSend({type:'ready', units: G.units.filter(u=>u.owner===G.myRole)});
    G.phase = 'onlineWaitingOpp';
    render();
    maybeHostMerge();
  }
}

function startBattlePhase(){
  G.phase = 'battle';
  G.turn = 'player';
  G.actionsLeft = 3;
  G.units.forEach(u=>u.acted=false);
  logMsg(`Round ${G.round} begins on "${G.map.name}".`);
  render();
}

/* ============================= BATTLE PHASE ============================= */

function selectUnit(id){
  const u = G.units.find(x=>x.id===id);
  const me = viewerRole();
  if(!u || u.owner!==me || u.hp<=0) return;
  if(u.acted){ G.selected=null; G.uiMode='idle'; render(); return; }
  G.selected = id; G.uiMode = 'idle'; render();
}
function beginMove(){ if(!G.selected) return; G.uiMode='move'; render(); }
function beginAttack(){ if(!G.selected) return; G.uiMode='attack'; render(); }
function cancelMode(){ G.uiMode='idle'; render(); }

function doMove(unit,x,y){
  unit.x = x; unit.y = y;
  if(unit.key==='cannonship' && !pointInAnyLake(x,y)){
    unit.hasLanded = true;
    logMsg(`${teamName(unit.owner)}'s Cannonship comes ashore — it can't move again.`);
  }
  unit.acted = true;
  G.actionsLeft--;
  logMsg(`${teamName(unit.owner)}'s ${labelFor(unit)} moves.`);
  clearSelectionAfterAction();
}

function doAttack(attacker, defender){
  const aStats = statsOf(attacker), dStats = statsOf(defender);
  defender.hp -= aStats.dmg;
  attacker.acted = true;
  G.actionsLeft--;
  logMsg(`${teamName(attacker.owner)}'s ${labelFor(attacker)} hits ${teamName(defender.owner)}'s ${labelFor(defender)} for ${aStats.dmg}.`);
  if(defender.hp <= 0){
    logMsg(`${teamName(defender.owner)}'s ${labelFor(defender)} is destroyed!`);
  } else if(dStats.range >= dist(attacker.x,attacker.y,defender.x,defender.y)){
    attacker.hp -= dStats.dmg;
    logMsg(`${teamName(defender.owner)}'s ${labelFor(defender)} retaliates for ${dStats.dmg}.`);
    if(attacker.hp <= 0) logMsg(`${teamName(attacker.owner)}'s ${labelFor(attacker)} is destroyed by the retaliation!`);
  }
  clearSelectionAfterAction();
}

function clearSelectionAfterAction(){
  G.selected = null; G.uiMode = 'idle';
  checkRoundEnd();
  if(G.phase === 'battle' && G.actionsLeft <= 0){
    endPlayerTurn(); // handles its own render + (online) network sync
    return;
  }
  render();
  if(G.mode==='online') netSend({type:'state', state:serializeState()});
}

function endPlayerTurn(){
  if(G.phase !== 'battle') return;
  const me = viewerRole();
  if(G.turn !== me) return;
  const next = otherRole(G.turn);
  G.turn = next;

  if(G.mode === 'vsBot'){
    render();
    setTimeout(runBotTurn, 500);
  } else if(G.mode === 'passPlay'){
    showInterstitial(`Pass the device to ${sideLabel(next)}. Tap Continue when ready.`, ()=>{
      G.actionsLeft = 3;
      G.units.forEach(u=>u.acted=false);
      G.phase = 'battle';
      render();
    });
  } else if(G.mode === 'online'){
    G.actionsLeft = 3;
    G.units.forEach(u=>u.acted=false);
    render();
    netSend({type:'state', state:serializeState()});
  }
}

function runBotTurn(){
  if(G.phase !== 'battle') return;
  let actions = 3;
  G.units.filter(u=>u.owner==='bot').forEach(u=>u.acted=false);
  const step = ()=>{
    if(actions<=0 || G.phase!=='battle'){ finishBotTurn(); return; }
    const acted = botAct();
    actions--;
    render();
    if(!acted){ finishBotTurn(); return; }
    if(G.phase!=='battle') return;
    setTimeout(step, 420);
  };
  step();
}
function finishBotTurn(){
  if(G.phase!=='battle') return;
  G.turn='player'; G.actionsLeft=3;
  G.units.forEach(u=>u.acted=false);
  render();
}

function scoreAttack(pair){
  const aStats = statsOf(pair.attacker), dStats = statsOf(pair.target);
  const afterHp = pair.target.hp - aStats.dmg;
  let score = aStats.dmg;
  if(afterHp <= 0){
    score += 50 + (pair.target.isBase ? 100 : 0);
  } else {
    const d = dist(pair.attacker.x,pair.attacker.y,pair.target.x,pair.target.y);
    if(dStats.range >= d){
      score -= dStats.dmg;
      if(pair.attacker.hp - dStats.dmg <= 0) score -= 20;
    }
  }
  if(pair.target.isBase) score += 5;
  return score;
}

function botAct(){
  const mine = livingUnits('bot').filter(u=>!u.acted);
  if(mine.length===0) return false;
  const tier = DIFFICULTIES[G.difficulty].tier;
  const knownEnemies = () => tier>=3 ? livingUnits('player') : livingUnits('player').filter(p=>isUnitVisibleTo('bot',p));

  const candidates = [];
  mine.forEach(u=>{
    const stats = statsOf(u);
    knownEnemies().forEach(p=>{
      if(dist(u.x,u.y,p.x,p.y) <= stats.range) candidates.push({attacker:u, target:p});
    });
  });
  if(candidates.length){
    let chosen;
    if(tier === 0){
      chosen = candidates[Math.floor(Math.random()*candidates.length)];
    } else {
      let bestScore = -Infinity;
      candidates.forEach(c=>{ const s = scoreAttack(c); if(s > bestScore){ bestScore = s; chosen = c; } });
    }
    botAttack(chosen.attacker, chosen.target);
    return true;
  }

  for(const u of mine){
    const stats = statsOf(u);
    if(stats.speed<=0){ u.acted=true; continue; }
    let enemies = knownEnemies();
    if(enemies.length===0) enemies = livingUnits('player');
    if(enemies.length===0){ u.acted=true; continue; }
    let best=null, bestDist=Infinity;
    enemies.forEach(e=>{ const d=dist(e.x,e.y,u.x,u.y); if(d<bestDist){ bestDist=d; best=e; } });
    const angle = Math.atan2(best.y-u.y, best.x-u.x);
    let dest = marchMax(u, angle, stats.speed);
    if(tier>=2){
      const lethalNearby = enemies.some(e=>{
        const eStats = statsOf(e);
        return eStats.range >= dist(dest.x,dest.y,e.x,e.y) && eStats.dmg >= u.hp;
      });
      const canThreatenBack = enemies.some(e=> stats.range >= dist(dest.x,dest.y,e.x,e.y));
      if(lethalNearby && !canThreatenBack){
        dest = marchMax(u, angle, stats.speed*0.45);
      }
    }
    if(dist(dest.x,dest.y,u.x,u.y) < 0.05){ u.acted=true; continue; }
    let fx=dest.x, fy=dest.y;
    if(tooCloseToAnyUnit(fx,fy,u.id)){
      const back = 0.6;
      fx = u.x + (fx-u.x)*Math.max(0,1-back/Math.max(0.001,dist(u.x,u.y,fx,fy)));
      fy = u.y + (fy-u.y)*Math.max(0,1-back/Math.max(0.001,dist(u.x,u.y,fx,fy)));
    }
    u.x=fx; u.y=fy; u.acted=true;
    if(u.key==='cannonship' && !pointInAnyLake(fx,fy)) u.hasLanded = true;
    logMsg(`${teamName(u.owner)}'s ${labelFor(u)} advances.`);
    return true;
  }
  return false;
}

function botAttack(attacker, defender){
  const aStats = statsOf(attacker), dStats = statsOf(defender);
  defender.hp -= aStats.dmg;
  attacker.acted = true;
  logMsg(`${teamName(attacker.owner)}'s ${labelFor(attacker)} hits ${teamName(defender.owner)}'s ${labelFor(defender)} for ${aStats.dmg}.`);
  if(defender.hp <= 0){
    logMsg(`${teamName(defender.owner)}'s ${labelFor(defender)} is destroyed!`);
  } else if(dStats.range >= dist(attacker.x,attacker.y,defender.x,defender.y)){
    attacker.hp -= dStats.dmg;
    logMsg(`${teamName(defender.owner)}'s ${labelFor(defender)} retaliates for ${dStats.dmg}.`);
    if(attacker.hp <= 0) logMsg(`${teamName(attacker.owner)}'s ${labelFor(attacker)} is destroyed by the retaliation!`);
  }
  checkRoundEnd();
}

function checkRoundEnd(){
  const playerBase = G.units.find(u=>u.owner==='player' && u.isBase);
  const botBase = G.units.find(u=>u.owner==='bot' && u.isBase);
  if(playerBase && playerBase.hp<=0){
    G.wins.bot++; G.phase='roundover'; G.roundWinner='bot';
    logMsg(`${teamName('player')}'s base has fallen — ${teamName('bot')} wins round ${G.round}.`);
  } else if(botBase && botBase.hp<=0){
    G.wins.player++; G.phase='roundover'; G.roundWinner='player';
    logMsg(`${teamName('bot')}'s base has fallen — ${teamName('player')} wins round ${G.round}.`);
  }
  if(G.phase==='roundover' && (G.wins.player>=2 || G.wins.bot>=2)) G.phase='matchover';
}

function nextRound(){
  G.round++;
  G.leftover = G.pendingLeftover || 0;
  G.pendingLeftover = 0;
  G.units = [];
  G.nextId = 1;
  G.selected = null;
  G.uiMode = 'idle';
  G.phase = 'mapselect';
  G.mapMode = null;
  G.activeSetupRole = null;
  G.localReady = false; G.oppReady = false; G.oppUnits = null;
  BOARD.w = 7; BOARD.h = 14;
  render();
  if(G.mode==='online' && G.myRole==='player') netSend({type:'state', state:serializeState()});
}

function showInterstitial(message, onContinue){
  G.phase = 'interstitial';
  G.interstitialMessage = message;
  G.interstitialContinue = onContinue;
  render();
}

/* ============================= RENDER ============================= */

const SVG_NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==='class') e.className = v;
    else if(k==='html') e.innerHTML = v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if(v===false || v===null || v===undefined){ /* omit boolean-false attrs like disabled */ }
    else if(v===true) e.setAttribute(k,'');
    else e.setAttribute(k,v);
  });
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c===null||c===undefined) return;
    e.appendChild(typeof c==='string' ? document.createTextNode(c) : c);
  });
  return e;
}
function elS(tag, attrs={}, children=[]){
  const e = document.createElementNS(SVG_NS, tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==='class') e.setAttribute('class', v);
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k,v);
  });
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c===null||c===undefined) return;
    e.appendChild(typeof c==='string' ? document.createTextNode(c) : c);
  });
  return e;
}

function renderPips(){
  const pp = document.getElementById('playerPips');
  const bp = document.getElementById('botPips');
  pp.innerHTML=''; bp.innerHTML='';
  for(let i=0;i<2;i++){
    pp.appendChild(el('div',{class:'pip'+(i<G.wins.player?' filled-player':'')}));
    bp.appendChild(el('div',{class:'pip'+(i<G.wins.bot?' filled-bot':'')}));
  }
  document.getElementById('roundNum').textContent = Math.min(G.round,3);
  const tag = document.getElementById('difficultyTag');
  const hideDiffPhases = ['mainmenu','difficulty','onlineMenu','onlineHostWait','onlineJoinEntry'];
  tag.textContent = (G.mode==='vsBot' && !hideDiffPhases.includes(G.phase) && G.difficulty) ? DIFFICULTIES[G.difficulty].label : '';
  const pl = document.getElementById('playerLabel');
  const bl = document.getElementById('botLabel');
  if(pl) pl.textContent = sideLabel('player');
  if(bl) bl.textContent = sideLabel('bot');
}

function render(){
  renderPips();
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(G.phase==='mainmenu'){ app.appendChild(renderMainMenu()); return; }
  if(G.phase==='onlineMenu'){ app.appendChild(renderOnlineMenu()); return; }
  if(G.phase==='onlineHostWait'){ app.appendChild(renderOnlineHostWait()); return; }
  if(G.phase==='onlineJoinEntry'){ app.appendChild(renderOnlineJoinEntry()); return; }
  if(G.phase==='onlineWaitingOpp'){ app.appendChild(renderOnlineWaitingOpp()); return; }
  if(G.phase==='interstitial'){ app.appendChild(renderInterstitial()); return; }
  if(G.phase==='difficulty'){ app.appendChild(renderDifficultySelect()); return; }
  if(G.phase==='mapselect'){ app.appendChild(renderMapSelect()); return; }
  if(G.phase==='setup'){ app.appendChild(renderSetup()); return; }
  if(G.phase==='placing'){ app.appendChild(renderBattleLayout(true)); return; }
  if(G.phase==='battle'){ app.appendChild(renderBattleLayout(false)); return; }
  if(G.phase==='roundover'){ app.appendChild(renderRoundOver()); return; }
  if(G.phase==='matchover'){ app.appendChild(renderMatchOver()); return; }
}

function renderMainMenu(){
  const wrap = el('div',{});
  const panel = el('div',{class:'panel'});
  panel.appendChild(el('h2',{}, 'How do you want to play?'));
  const grid = el('div',{class:'card-grid'});

  const vsBotCard = el('div',{class:'map-card'});
  vsBotCard.appendChild(el('div',{style:'font-size:2.4rem; text-align:center;'}, '🤖'));
  vsBotCard.appendChild(el('b',{}, 'vs Bot'));
  vsBotCard.appendChild(el('span',{}, 'Play against the AI, with adjustable difficulty.'));
  vsBotCard.appendChild(el('button',{onclick:()=>chooseMode('vsBot')}, 'Play vs Bot'));

}

function drawTerrain(svg, map, opts={}){
  const dim = opts.dim || 1;
  svg.appendChild(elS('rect',{x:0,y:0,width:BOARD.w,height:BOARD.h,fill:'var(--ground)'}));
  svg.appendChild(elS('rect',{x:0,y:0,width:BOARD.w,height:BOARD.h/2,fill:'var(--enemy-dim)',opacity:'0.10'}));
  svg.appendChild(elS('rect',{x:0,y:BOARD.h/2,width:BOARD.w,height:BOARD.h/2,fill:'var(--player-dim)',opacity:'0.10'}));
  svg.appendChild(elS('line',{x1:0,y1:BOARD.h/2,x2:BOARD.w,y2:BOARD.h/2,stroke:'var(--panel-border)','stroke-width':0.03,'stroke-dasharray':'0.1,0.08'}));
  map.mountains.forEach(m=>{
    svg.appendChild(elS('circle',{cx:m.x,cy:m.y,r:m.r,fill:'var(--mountain)',stroke:'#0c0e08','stroke-width':0.03,opacity:dim}));
  });
  map.lakes.forEach(l=>{
    svg.appendChild(elS('circle',{cx:l.x,cy:l.y,r:l.r,fill:'var(--lake)',stroke:'#0c0e08','stroke-width':0.03,opacity:dim}));
  });
}

function tinyMapPreview(map){
  const svg = elS('svg',{width:'120', height:'240', viewBox:`-0.4 -0.4 ${BOARD.w+0.8} ${BOARD.h+0.8}`});

  return svg;
}

function renderMapSelect(){
  const wrap = el('div',{});
  const panel = el('div',{class:'panel'});

  if(G.mode==='online' && G.myRole!=='player'){
    panel.appendChild(el('h2',{}, 'Waiting for the host to choose a map…'));
    panel.appendChild(el('p',{class:'hint'}, "The battlefield will appear here as soon as they pick one."));
    wrap.appendChild(panel);
    return wrap;
  }

  panel.appendChild(el('h2',{}, `Round ${G.round}: choose your battlefield`));
  panel.appendChild(el('div',{class:'budget-line'}, `Preset maps play a 7×7 zone per side (${totalBudgetBase()} pts). The random battlefield rolls its own size too — points always scale to 4× the side length.` + (G.leftover>0?` +${G.leftover} carried over.`:'')));

  if(G.mapMode !== 'presets'){
    const grid = el('div',{class:'card-grid'});

    const randCard = el('div',{class:'map-card'});
    randCard.appendChild(el('div',{style:'font-size:2.4rem; text-align:center;'}, '🎲'));
    randCard.appendChild(el('b',{}, 'Random Battlefield'));
    randCard.appendChild(el('span',{}, "Fully random, asymmetric terrain on a random board size (5–15 per side) — no fairness guarantee, no preview. You find out what you got once the battle starts."));
    randCard.appendChild(el('button',{onclick:()=>setCustomMap(generateRandomMap())}, 'Go In Blind'));
    grid.appendChild(randCard);

    const presetCard = el('div',{class:'map-card'});
    presetCard.appendChild(el('div',{style:'font-size:2.4rem; text-align:center;'}, '🗺'));
    presetCard.appendChild(el('b',{}, 'Preset Maps'));
    presetCard.appendChild(el('span',{}, "Pick from three hand-built, mirrored battlefields — you see exactly what you're choosing."));
    presetCard.appendChild(el('button',{onclick:()=>{ G.mapMode='presets'; render(); }}, 'Choose a Map'));
    grid.appendChild(presetCard);

    panel.appendChild(grid);
    wrap.appendChild(panel);
    return wrap;
  }

  const choices = el('div',{class:'map-choices'});

    const card = el('div',{class:'map-card'});

    card.appendChild(el('button',{onclick:()=>setMap(m.key)}, 'Select Map'));
    choices.appendChild(card);
  });
  panel.appendChild(choices);
  panel.appendChild(el('button',{class:'ghost', style:'margin-top:12px;', onclick:()=>{ G.mapMode=null; render(); }}, '← Back'));
  wrap.appendChild(panel);
  return wrap;
}

function renderSetup(){
  const wrap = el('div',{});
  const panel = el('div',{class:'panel'});

  const heading = G.mode==='passPlay' ? `${sideLabel(role)} — Setup — ${G.map.name}` : `Setup — ${G.map.name}`;
  panel.appendChild(el('h2',{}, heading));
  panel.appendChild(el('div',{class:'budget-line'}, ['Budget: ', el('b',{},String(remainingPoints())), ` / ${totalBudget()} points remaining`]));

    const item = el('div',{class:'shop-item'});

    qtyRow.appendChild(el('span',{class:'qty-count'}, String(G.shopCounts[def.key]||0)));

    el('button',{onclick:confirmShop}, 'Confirm & Place Units')

function renderBattleLayout(isPlacing){
  const wrap = el('div',{class:'board-wrap'});
  wrap.appendChild(renderBoard(isPlacing));
  wrap.appendChild(renderSide(isPlacing));
  return wrap;
}

function svgPointFromEvent(svg, evt){
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  const ctm = svg.getScreenCTM().inverse();
  const p = pt.matrixTransform(ctm);
  return {x:p.x, y:p.y};
}

function renderBoard(isPlacing){
  const holder = el('div',{id:'boardHolder'});
  const pad = 0.5;
  const svg = elS('svg',{
    width:'340', height: String(Math.round(340*(BOARD.h+pad*2)/(BOARD.w+pad*2))),
    viewBox:`${-pad} ${-pad} ${BOARD.w+pad*2} ${BOARD.h+pad*2}`
  });

  const me = viewerRole();
  const opp = otherRole(me);

  drawTerrain(svg, G.map);

  const visible = G.phase==='battle' || G.phase==='placing';
  const sel = (!isPlacing && G.selected) ? G.units.find(u=>u.id===G.selected) : null;

  // fog: my half is always known; the far half is hidden entirely except inside
  // my units' vision circles. Nothing peeks through — full opacity.
  if(visible){
    const maskId = 'fogmask';
    const mask = elS('mask',{id:maskId});
    mask.appendChild(elS('rect',{x:-pad,y:-pad,width:BOARD.w+pad*2,height:BOARD.h+pad*2,fill:'white'}));
    if(me==='player'){
      mask.appendChild(elS('rect',{x:0,y:BOARD.h/2,width:BOARD.w,height:BOARD.h/2,fill:'black'}));
    } else {
      mask.appendChild(elS('rect',{x:0,y:0,width:BOARD.w,height:BOARD.h/2,fill:'black'}));
    }
    livingUnits(me).forEach(u=>{
      mask.appendChild(elS('circle',{cx:u.x,cy:u.y,r:statsOf(u).vision,fill:'black'}));
    });
    const defs = elS('defs',{}); defs.appendChild(mask);
    svg.appendChild(defs);
    svg.appendChild(elS('rect',{x:-pad,y:-pad,width:BOARD.w+pad*2,height:BOARD.h+pad*2,fill:'var(--fog)',opacity:'1',mask:`url(#${maskId})`}));
  }

  // move / attack overlays for the selected unit
  if(sel && !sel.acted && G.turn===me){
    if(G.uiMode==='move'){
      const poly = reachablePolygon(sel);
      svg.appendChild(elS('polygon',{points:poly.map(p=>`${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(' '), fill:colorFor(me), opacity:'0.18', stroke:colorFor(me), 'stroke-width':0.035}));
    }
    if(G.uiMode==='attack'){
      const stats = statsOf(sel);
      svg.appendChild(elS('circle',{cx:sel.x,cy:sel.y,r:stats.range, fill:colorFor(opp), opacity:'0.10', stroke:colorFor(opp), 'stroke-width':0.04, 'stroke-dasharray':'0.12,0.09'}));
      livingUnits(opp).forEach(b=>{
        if(isUnitVisibleTo(me,b) && dist(sel.x,sel.y,b.x,b.y)<=stats.range){
          svg.appendChild(elS('circle',{cx:b.x,cy:b.y,r:0.55,fill:'none',stroke:colorFor(opp),'stroke-width':0.06}));
        }
      });
    }
  }

  // placement zone hint (highlights whichever half is currently setting up)
  if(isPlacing){
    const hy = me==='player' ? BOARD.h/2+0.15 : 0.15;
    svg.appendChild(elS('rect',{x:0.15,y:hy,width:BOARD.w-0.3,height:BOARD.h/2-0.3, fill:'none', stroke:'var(--gold)', 'stroke-width':0.03, 'stroke-dasharray':'0.15,0.1'}));
  }

  // units
  G.units.forEach(u=>{
    if(u.hp<=0) return;
    if(visible && u.owner===opp && !isUnitVisibleTo(me,u)) return;
    const stats = statsOf(u);
    const color = u.owner==='player' ? 'var(--player)' : 'var(--enemy)';
    const dimColor = u.owner==='player' ? 'var(--player-dim)' : 'var(--enemy-dim)';
    const rOuter = u.isBase ? 0.5 : 0.4;
    if(u.isBase){
      svg.appendChild(elS('rect',{x:u.x-rOuter,y:u.y-rOuter,width:rOuter*2,height:rOuter*2,rx:0.08,fill:dimColor,stroke:color,'stroke-width':0.045}));
    } else {
      svg.appendChild(elS('circle',{cx:u.x,cy:u.y,r:rOuter,fill:dimColor,stroke:color,'stroke-width':0.045}));
    }
    if(u.id===G.selected){
      svg.appendChild(elS('circle',{cx:u.x,cy:u.y,r:rOuter+0.12,fill:'none',stroke:'#fff','stroke-width':0.04}));
    }
    svg.appendChild(elS('text',{x:u.x,y:u.y,'font-size':0.5,'text-anchor':'middle','dominant-baseline':'central',fill:'var(--ink)'}, stats.icon));
    const hpPct = Math.max(0, u.hp/u.maxHp);
    const barW = 0.75;
    svg.appendChild(elS('rect',{x:u.x-barW/2,y:u.y+rOuter+0.08,width:barW,height:0.09,fill:'rgba(0,0,0,0.5)',rx:0.03}));
    const hpColor = hpPct<0.34 ? '#e0503a' : (hpPct<0.67 ? '#e0b23a' : '#8fe08a');
    svg.appendChild(elS('rect',{x:u.x-barW/2,y:u.y+rOuter+0.08,width:barW*hpPct,height:0.09,fill:hpColor,rx:0.03}));
  });

  svg.addEventListener('click', (evt)=>{
    const p = svgPointFromEvent(svg, evt);
    const hit = unitAtPoint(p.x, p.y);
    const validHit = hit && hit.hp>0 && !(visible && hit.owner===opp && !isUnitVisibleTo(me,hit)) ? hit : null;
    onBoardClick(p.x, p.y, validHit);
  });

  holder.appendChild(svg);
  const legend = el('div',{class:'legend'},[
    el('span',{},[el('span',{class:'swatch', style:'background:var(--mountain)'}), 'Mountain (2× move cost)']),
    el('span',{},[el('span',{class:'swatch', style:'background:var(--lake)'}), 'Lake (impassable)']),
    el('span',{},[el('span',{class:'swatch', style:'background:var(--fog)'}), 'Fogged']),
  ]);
  const wrap = el('div',{});
  wrap.appendChild(holder);
  wrap.appendChild(legend);
  return wrap;
}

function onBoardClick(x,y,hitUnit){
  if(G.phase==='placing'){
    if(!hitUnit) placeAt(x,y);
    return;
  }
  if(G.phase!=='battle') return;
  const me = viewerRole();
  if(G.turn !== me) return;
  const opp = otherRole(me);

  if(G.uiMode==='move' && G.selected){
    const u = G.units.find(v=>v.id===G.selected);
    if(!hitUnit && evaluatePath(u,x,y).reachable) doMove(u,x,y);
    return;
  }
  if(G.uiMode==='attack' && G.selected){
    const u = G.units.find(v=>v.id===G.selected);
    if(hitUnit && hitUnit.owner===opp){
      const stats = statsOf(u);
      if(dist(u.x,u.y,hitUnit.x,hitUnit.y) <= stats.range) doAttack(u, hitUnit);
    }
    return;
  }
  if(hitUnit && hitUnit.owner===me) selectUnit(hitUnit.id);
}

function renderSide(isPlacing){
  const side = el('div',{class:'side'});
  const me = viewerRole();

  if(isPlacing){
    const panel = el('div',{class:'panel'});
    panel.appendChild(el('h3',{}, 'Place your units'));
    panel.appendChild(el('p',{class:'hint'}, 'Click anywhere in your dashed half to place the next unit — on plain ground for most units, on a mountain for the Mountainman, or on water for the Cannonship.'));
    const q = el('div',{class:'placement-queue'});
    G.placementQueue.forEach((k,i)=>{
      q.appendChild(el('span',{class:'queue-chip'+(i<G.placeCursor?' done':'')}, UNIT_TYPES[k].icon+' '+UNIT_TYPES[k].name));
    });
    panel.appendChild(q);
    side.appendChild(panel);
    return side;
  }

  side.appendChild(renderTurnBanner(me));

  const infoPanel = el('div',{class:'info-box'});
  const sel = G.selected ? G.units.find(x=>x.id===G.selected) : null;
  if(sel){
    const stats = statsOf(sel);
    infoPanel.appendChild(el('div',{class:'name'}, `${stats.icon} ${labelFor(sel)}`));
    infoPanel.appendChild(el('div',{class:'line'}, `HP ${sel.hp}/${sel.maxHp} · Range ${stats.range} · Dmg ${stats.dmg} · Speed ${stats.speed}`));
    if(sel.acted){
      infoPanel.appendChild(el('div',{class:'line'}, 'Already acted this turn.'));
    } else if(G.turn===me){
      const btnRow = el('div',{class:'row', style:'margin-top:8px;'});
      btnRow.appendChild(el('button',{onclick:beginMove, disabled: G.uiMode==='move'}, 'Move'));
      btnRow.appendChild(el('button',{onclick:beginAttack, disabled: G.uiMode==='attack'}, 'Attack'));
      if(G.uiMode!=='idle') btnRow.appendChild(el('button',{class:'ghost', onclick:cancelMode}, 'Cancel'));
      infoPanel.appendChild(btnRow);
      if(G.uiMode==='move') infoPanel.appendChild(el('div',{class:'hint'},'Click anywhere in the highlighted area to move there.'));
      if(G.uiMode==='attack') infoPanel.appendChild(el('div',{class:'hint'},'Click a ringed enemy to strike it.'));
    }
  } else {
    infoPanel.appendChild(el('div',{class:'line'}, 'Select one of your units to move or attack.'));
  }
  side.appendChild(infoPanel);

  if(G.turn===me) side.appendChild(el('button',{class:'danger', onclick:endPlayerTurn}, 'End Turn'));

  const logBox = el('div',{class:'log'});
  [...G.log].reverse().forEach(line => logBox.appendChild(el('div',{},line)));
  side.appendChild(logBox);
  return side;
}

function renderTurnBanner(me){
  const bannerClass = G.turn==='player' ? 'player' : 'bot';
  let text;
  if(G.mode === 'passPlay'){
    text = `${sideLabel(G.turn)}'s turn — ${G.actionsLeft} action${G.actionsLeft===1?'':'s'} left`;
  } else if(G.turn === me){
    text = `Your turn — ${G.actionsLeft} action${G.actionsLeft===1?'':'s'} left`;
  } else {
    text = G.mode==='vsBot' ? 'Bot is thinking…' : "Opponent's turn…";
  }
  return el('div',{class:'turn-banner '+bannerClass}, text);
}

function roundHeadline(winnerRole){
  const label = sideLabel(winnerRole);
  const verb = (label === 'You') ? 'win' : 'wins';
  return `${label} ${verb} round ${G.round}!`;
}

function renderRoundOver(){
  const p = el('div',{class:'panel center-msg'});
  const iAmWinner = G.mode!=='passPlay' && G.roundWinner===viewerRole();
  const icon = G.mode==='passPlay' ? '🏁' : (iAmWinner ? '🏆' : '💥');
  p.appendChild(el('div',{style:'font-size:2.4rem; margin-bottom:6px;'}, icon));
  p.appendChild(el('h2',{style:'color:'+colorFor(G.roundWinner)}, roundHeadline(G.roundWinner)));
  p.appendChild(el('p',{}, `${sideLabel('player')} ${G.wins.player} – ${G.wins.bot} ${sideLabel('bot')}`));
  if(G.mode!=='online' || G.myRole==='player'){
    p.appendChild(el('button',{onclick:nextRound}, `Continue to Round ${G.round+1}`));
  } else {
    p.appendChild(el('p',{class:'hint'}, 'Waiting for the host to continue…'));
  }
  return p;
}
function renderMatchOver(){
  const p = el('div',{class:'panel center-msg'});
  const winnerRole = G.wins.player > G.wins.bot ? 'player' : 'bot';
  const iAmWinner = G.mode!=='passPlay' && winnerRole===viewerRole();
  const icon = G.mode==='passPlay' ? '🏁' : (iAmWinner ? '👑' : '☠');
  p.appendChild(el('div',{style:'font-size:2.4rem; margin-bottom:6px;'}, icon));
  const label = sideLabel(winnerRole);
  const verb = (label==='You') ? 'win' : 'wins';
  p.appendChild(el('h2',{style:'color:'+colorFor(winnerRole)}, `${label} ${verb} the match!`));
  let footer = `Final score: ${sideLabel('player')} ${G.wins.player} – ${G.wins.bot} ${sideLabel('bot')}`;
  if(G.mode==='vsBot') footer += ` · ${DIFFICULTIES[G.difficulty].label} difficulty`;
  p.appendChild(el('p',{}, footer));
  if(G.mode==='online'){
    if(G.myRole==='player') p.appendChild(el('button',{onclick:onlineRematch}, 'Rematch'));
    else p.appendChild(el('p',{class:'hint'}, 'Waiting for the host to start a rematch…'));
  } else {
    p.appendChild(el('button',{onclick:newMatch}, 'Play Again'));
  }
  return p;
}

newMatch();
